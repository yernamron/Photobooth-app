
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>My Photobooth</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      color: white;
      background: linear-gradient(135deg, #261b47, #a45e91);
      display: grid;
      place-items: center;
      padding: 20px;
    }
    .app {
      width: 100%;
      max-width: 850px;
      text-align: center;
      background: #ffffff14;
      padding: 24px;
      border-radius: 24px;
      border: 1px solid #ffffff35;
    }
    video, #preview {
      display: block;
      width: 100%;
      max-height: 460px;
      object-fit: contain;
      background: #171322;
      border-radius: 16px;
      margin: 16px auto;
    }
    button, .upload {
      display: inline-block;
      border: 0;
      border-radius: 30px;
      padding: 13px 20px;
      margin: 5px;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
      background: #ffe5a8;
      color: #35213f;
    }
    input { max-width: 100%; }
    #status { min-height: 24px; }
  </style>
</head>
<body>
  <main class="app">
    <h1>📸 My Photobooth</h1>
    <p>Smile, pose, and capture your memories!</p>

    <video id="camera" autoplay playsinline></video>
    <canvas id="canvas" hidden></canvas>
    <img id="preview" alt="Captured photo" hidden>

    <div>
      <button id="start">Open Camera</button>
      <button id="capture" disabled>Take Photo</button>
      <button id="retake" hidden>Retake</button>
      <a id="download" hidden download="photobooth.jpg">
        <button type="button">Download Photo</button>
      </a>
    </div>

    <p id="status">Tap Open Camera to begin.</p>

    <hr>
    <h3>Upload a photo frame</h3>
    <input id="frameInput" type="file" accept="image/*">
    <p>Choose a transparent PNG frame to overlay on your photo.</p>
  </main>

  <script>
    const camera = document.querySelector("#camera");
    const canvas = document.querySelector("#canvas");
    const ctx = canvas.getContext("2d");
    const preview = document.querySelector("#preview");
    const status = document.querySelector("#status");
    const capture = document.querySelector("#capture");
    const retake = document.querySelector("#retake");
    const download = document.querySelector("#download");
    const frameInput = document.querySelector("#frameInput");

    let stream;
    let frame = null;

    document.querySelector("#start").onclick = async () => {
      try {
        stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: "user" },
          audio: false
        });
        camera.srcObject = stream;
        capture.disabled = false;
        status.textContent = "Camera ready. Say cheese!";
      } catch (error) {
        status.textContent =
          "Camera unavailable. Allow camera access and use HTTPS.";
      }
    };

    frameInput.onchange = () => {
      const file = frameInput.files[0];
      if (!file) return;
      frame = new Image();
      frame.onload = () => status.textContent = "Frame loaded!";
      frame.src = URL.createObjectURL(file);
    };

    capture.onclick = () => {
      if (!camera.videoWidth) return;

      canvas.width = camera.videoWidth;
      canvas.height = camera.videoHeight;

      ctx.save();
      ctx.translate(canvas.width, 0);
      ctx.scale(-1, 1);
      ctx.drawImage(camera, 0, 0, canvas.width, canvas.height);
      ctx.restore();

      if (frame) {
        ctx.drawImage(frame, 0, 0, canvas.width, canvas.height);
      }

      preview.src = canvas.toDataURL("image/jpeg", 0.95);
      preview.hidden = false;
      camera.hidden = true;
      capture.disabled = true;
      retake.hidden = false;
      download.href = preview.src;
      download.hidden = false;
      status.textContent = "Photo captured! Download your memory.";
    };

    retake.onclick = () => {
      preview.hidden = true;
      camera.hidden = false;
      capture.disabled = false;
      retake.hidden = true;
      download.hidden = true;
      status.textContent = "Ready for another photo!";
    };
  </script>
</body>
</html>
